[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartwood"
version = "0.1.0"
description = "Gradient boosting for datasets that mix static features with raw time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
bench = ["scikit-learn>=1.3", "xgboost>=2.0"]

[tool.setuptools]
packages = ["heartwood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
