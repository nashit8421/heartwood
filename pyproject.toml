[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartwood"
version = "1.0.0"
description = "Gradient-boosted trees whose splits read raw time series, not just aggregates of it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["time-series", "gradient-boosting", "classification", "shapelets", "minirocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
bench = ["scikit-learn>=1.3", "xgboost>=2.0"]

[tool.setuptools]
packages = ["heartwood"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
